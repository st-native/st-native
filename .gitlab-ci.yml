# SPDX-License-Identifier: GPL-3.0-or-later
# GitLab CI for Spirit Tracks Native (docs/PUBLISHING.md). Never runs with a ROM: everything here uses our own code and
# the synthetic cartridge. NOT RUN YET: prepared locally on 2026-11-14 from the jobs validated on GitHub Actions in M1a
# (spike/m1a/ci/m1a.yml); check every job on the first pipeline.

stages: [guard, test, build]

variables:
  GIT_SUBMODULE_STRATEGY: none

# Nothing derived from the game may be in the repository (tools/check_no_game_data.py).
game-data-guard:
  stage: guard
  image: python:3.12-slim
  script:
    - python -I tools/check_no_game_data.py --tree .

unit-tests:
  stage: test
  image: python:3.12-slim
  script:
    - python -m unittest discover -s tests -t .

# V1 (engine + our patches build, unit tests), V2 (fibers), V3 (recompiler vs a reference ARM946) and the synthetic
# cartridge compared with the Windows reference hashes (spike/m1a/run_posix.sh).
.linux-m1a:
  stage: build
  image: ubuntu:24.04
  timeout: 90m
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git cmake clang lld
      ninja-build pkg-config python3 python3-venv xvfb xauth libx11-dev libxext-dev libxrandr-dev libxcursor-dev
      libxi-dev libxss-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl-dev libgl-dev libdrm-dev
      libgbm-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libgl1-mesa-dri libglx-mesa0
  artifacts:
    when: always
    paths: [spike/m1a/results/]

linux-x64:
  extends: .linux-m1a
  script:
    - xvfb-run -a bash spike/m1a/run_posix.sh "$CI_PROJECT_DIR/.work" 600 linux-x64

linux-arm64:
  extends: .linux-m1a
  tags: [saas-linux-small-arm64]
  script:
    - xvfb-run -a bash spike/m1a/run_posix.sh "$CI_PROJECT_DIR/.work" 600 linux-arm64

# GitLab's Windows runners (saas-windows-medium-amd64) and macOS runners (paid tiers) are not set up yet; Windows x64
# and macOS are checked locally and on the private M1a CI until then. Android: NDK compile + link
# (spike/m1a/run_android.sh) needs an image with the NDK; to be added with a pinned image.
